<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>You Know Ball?</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="overlay">

    <h1 class="title">
        YOU KN
        <img src="images/ball.png" class="ball-logo">
        W BALL?
    </h1>

    <div class="subtitle">LET'S SEE!</div>

    <div class="difficulty-row">

        <div class="difficulty bronze active" data-mode="easy">

            <div class="roman">I</div>

            <div class="mode-title">
                REEL WATCHER
            </div>

            <div class="mode-desc">
                Only 80+ Ratings
            </div>

        </div>

        <div class="difficulty silver" data-mode="medium">

            <div class="roman">II</div>

            <div class="mode-title">
                MID
            </div>

            <div class="mode-desc">
                Well-Known Players
            </div>

        </div>

        <div class="difficulty gold" data-mode="hard">

            <div class="roman">III</div>

            <div class="mode-title">
                BALL KNOWER
            </div>

            <div class="mode-desc">
                Deep Cuts
            </div>

        </div>

    </div>

    <div class="rules">

        <div class="column">

            <p><img src="images/kicker.png" class="rule-icon"> 20 yes/no questions. One hidden player.</p>
            <p><img src="images/kicker.png" class="rule-icon"> Reveal panels: position, flank, nationality, club.</p>

        </div>

        <div class="column">

            <p><img src="images/kicker.png" class="rule-icon"> Guess wrong and the match ends.</p>
            <p><img src="images/kicker.png" class="rule-icon"> The quicker the guess, the higher the score</p>

        </div>

    </div>

    <button id="readyBtn">
        READY
        <span>→</span>
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
