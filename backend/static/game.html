<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You Know Ball? — Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
    .game-wrap{
        width:100%;
        max-width:980px;
        margin:0 auto;
        padding:24px 18px 32px;
        display:flex;
        flex-direction:column;
        gap:18px;
        height:100vh;
    }

    /* ---------- TOP BAR ---------- */
    .topbar{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:14px;
        flex-wrap:wrap;
    }
    .brand{
        font-family:'Orbitron',sans-serif;
        font-weight:800;
        font-size:24px;
        letter-spacing:2px;
        color:#fff;
        text-shadow:0 2px 8px rgba(0,0,0,.7);
        display:flex;
        align-items:center;
        gap:8px;
    }
    .brand img{width:30px;height:30px;}
    .mode-pill{
        font-family:'Orbitron',sans-serif;
        font-size:13px;
        font-weight:700;
        letter-spacing:1px;
        color:#111;
        background:#f5f5f5;
        padding:6px 14px;
        border-radius:999px;
    }

    /* ---------- STATS ---------- */
    .stats{
        display:flex;
        gap:12px;
    }
    .stat{
        flex:1;
        background:rgba(0,0,0,.55);
        border-radius:14px;
        padding:12px 10px;
        text-align:center;
        color:#fff;
    }
    .stat .num{
        font-family:'Orbitron',sans-serif;
        font-size:30px;
        font-weight:800;
        line-height:1;
    }
    .stat .lbl{
        margin-top:6px;
        font-size:13px;
        letter-spacing:1px;
        opacity:.85;
        text-transform:uppercase;
    }

    /* ---------- PITCH / FEED ---------- */
    .board{
        position:relative;
        flex:1;
        min-height:0;
        border-radius:20px;
        overflow:hidden;
        background:url("images/pitch.jpg") center center/cover no-repeat;
        box-shadow:0 16px 40px rgba(0,0,0,.45);
        display:flex;
    }
    .board::before{
        content:"";
        position:absolute;
        inset:0;
        background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.55));
    }
    .silhouette{
        position:absolute;
        left:24px;
        bottom:0;
        height:78%;
        opacity:.9;
        filter:drop-shadow(0 6px 16px rgba(0,0,0,.6));
        pointer-events:none;
    }
    .feed{
        position:relative;
        margin-left:auto;
        width:62%;
        max-width:560px;
        padding:18px;
        overflow-y:auto;
        display:flex;
        flex-direction:column;
        gap:10px;
    }
    .bubble{
        border-radius:14px;
        padding:10px 14px;
        font-size:16px;
        line-height:1.4;
        animation:rise .25s ease;
    }
    @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
    .bubble.q{
        align-self:flex-end;
        background:#0e4b18;
        color:#fff;
        font-weight:600;
        max-width:85%;
    }
    .bubble.a{
        align-self:flex-start;
        background:rgba(255,255,255,.94);
        color:#111;
        max-width:90%;
    }
    .bubble.a .verdict{
        font-family:'Orbitron',sans-serif;
        font-weight:800;
        margin-right:6px;
    }
    .verdict.yes{color:#1c7a2e;}
    .verdict.no{color:#b5261a;}
    .verdict.unknown{color:#7a6a00;}
    .bubble.sys{
        align-self:center;
        background:rgba(0,0,0,.6);
        color:#ffe9a8;
        font-size:14px;
        text-align:center;
    }

    /* ---------- CONTROLS ---------- */
    .controls{
        display:flex;
        gap:10px;
    }
    #questionInput,#guessInput{
        flex:1;
        border:none;
        border-radius:14px;
        padding:14px 18px;
        font-family:'Rajdhani',sans-serif;
        font-size:18px;
        font-weight:600;
        outline:none;
    }
    .controls button{
        border:none;
        border-radius:14px;
        padding:0 22px;
        font-family:'Orbitron',sans-serif;
        font-weight:700;
        font-size:16px;
        cursor:pointer;
        transition:.2s;
    }
    .controls button:hover{transform:translateY(-2px);}
    .controls button:disabled{opacity:.5;cursor:not-allowed;transform:none;}
    #askBtn{background:#f5f5f5;color:#111;}
    #guessBtn{background:#e5c247;color:#111;}

    /* ---------- END OVERLAY ---------- */
    .end{
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.78);
        display:none;
        align-items:center;
        justify-content:center;
        z-index:20;
    }
    .end.show{display:flex;}
    .end-card{
        text-align:center;
        background:rgba(0,0,0,.6);
        padding:46px 40px;
        border-radius:24px;
        box-shadow:0 16px 40px rgba(0,0,0,.5);
    }
    .end-card h1{
        font-family:'Orbitron',sans-serif;
        font-size:48px;
        letter-spacing:3px;
        color:#fff;
        margin-bottom:10px;
    }
    .end-card p{color:#f5f5f5;font-size:22px;margin-bottom:26px;}
    .end-card .player{color:#e5c247;font-weight:700;}
    .end-card button{
        cursor:pointer;border:none;border-radius:999px;
        padding:14px 30px;font-size:17px;font-weight:700;
        background:#f5f5f5;color:#111;margin:0 6px;
    }
</style>
</head>
<body>
<div class="overlay">
    <div class="game-wrap">

        <div class="topbar">
            <div class="brand">
                <img src="images/ball.png" alt="">
                YOU KNOW BALL?
            </div>
            <div class="mode-pill" id="modePill">—</div>
        </div>

        <div class="stats">
            <div class="stat"><div class="num" id="qLeft">20</div><div class="lbl">Questions left</div></div>
            <div class="stat"><div class="num" id="gLeft">3</div><div class="lbl">Guesses left</div></div>
            <div class="stat"><div class="num" id="pool">—</div><div class="lbl">Suspects left</div></div>
        </div>

        <div class="board">
            <img src="images/kicker.png" class="silhouette" alt="hidden player">
            <div class="feed" id="feed"></div>
        </div>

        <div class="controls">
            <input id="questionInput" placeholder="Ask a yes/no question… e.g. Is he English?" autocomplete="off">
            <button id="askBtn">ASK</button>
            <button id="guessBtn">GUESS</button>
        </div>

    </div>
</div>

<div class="end" id="endOverlay">
    <div class="end-card">
        <h1 id="endTitle">GAME OVER</h1>
        <p id="endText"></p>
        <button id="playAgainBtn">Play again</button>
        <button id="menuBtn">Menu</button>
    </div>
</div>

<script>
const LABELS = { easy:"REEL WATCHER", medium:"MID", hard:"BALL KNOWER" };
const difficulty = localStorage.getItem("difficulty") || "easy";
let sessionId = null;
let busy = false;

const feed = document.getElementById("feed");
const qInput = document.getElementById("questionInput");
const askBtn = document.getElementById("askBtn");
const guessBtn = document.getElementById("guessBtn");

document.getElementById("modePill").textContent =
    (LABELS[difficulty] || difficulty.toUpperCase());

function addBubble(cls, html){
    const b = document.createElement("div");
    b.className = "bubble " + cls;
    b.innerHTML = html;
    feed.appendChild(b);
    feed.scrollTop = feed.scrollHeight;
    return b;
}

function updateStats(s){
    if (s.questions_left !== undefined) document.getElementById("qLeft").textContent = s.questions_left;
    if (s.guesses_left   !== undefined) document.getElementById("gLeft").textContent = s.guesses_left;
    if (s.remaining      !== undefined) document.getElementById("pool").textContent = s.remaining;
}

function setBusy(state){
    busy = state;
    askBtn.disabled = state;
    guessBtn.disabled = state;
}

function escapeHtml(str){
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
}

async function api(path, body){
    const res = await fetch(path, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || "Request failed");
    return data;
}

async function startGame(){
    addBubble("sys", "Picking a hidden player…");
    try {
        const data = await api("/api/game/new", { difficulty });
        sessionId = data.session_id;
        updateStats(data);
        feed.innerHTML = "";
        addBubble("sys", `A player is hidden. You have ${data.questions_left} questions and ${data.guesses_left} guesses. Ask away!`);
    } catch (e){
        addBubble("sys", "Could not start the game: " + e.message);
    }
}

async function ask(){
    const q = qInput.value.trim();
    if (!q || busy || !sessionId) return;
    addBubble("q", escapeHtml(q));
    qInput.value = "";
    setBusy(true);
    try {
        const data = await api("/api/game/ask", { session_id: sessionId, question: q });
        updateStats(data);
        if (data.valid){
            const v = (data.answer || "UNKNOWN").toLowerCase();
            addBubble("a", `<span class="verdict ${v}">${data.answer}</span>${escapeHtml(data.explanation || "")}`);
        } else {
            addBubble("sys", escapeHtml(data.message || "I couldn't understand that."));
        }
        if (data.finished) endGame(data);
    } catch (e){
        addBubble("sys", "Error: " + e.message);
    } finally {
        setBusy(false);
        qInput.focus();
    }
}

async function guess(){
    if (busy || !sessionId) return;
    const name = prompt("Who is the hidden player?");
    if (!name || !name.trim()) return;
    addBubble("q", "Guess: " + escapeHtml(name));
    setBusy(true);
    try {
        const data = await api("/api/game/guess", { session_id: sessionId, guess: name });
        updateStats(data);
        addBubble("sys", escapeHtml(data.message || ""));
        if (data.finished) endGame(data);
    } catch (e){
        addBubble("sys", "Error: " + e.message);
    } finally {
        setBusy(false);
    }
}

function endGame(data){
    setBusy(true);
    qInput.disabled = true;
    const won = data.outcome === "won" || data.correct === true;
    document.getElementById("endTitle").textContent = won ? "YOU GOT IT!" : "GAME OVER";
    const player = data.player_name ? `<span class="player">${escapeHtml(data.player_name)}</span>` : "the hidden player";
    document.getElementById("endText").innerHTML = won
        ? `Nicely done — it was ${player}.`
        : `The hidden player was ${player}.`;
    document.getElementById("endOverlay").classList.add("show");
}

askBtn.addEventListener("click", ask);
guessBtn.addEventListener("click", guess);
qInput.addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
document.getElementById("playAgainBtn").addEventListener("click", () => location.reload());
document.getElementById("menuBtn").addEventListener("click", () => location.href = "index.html");

startGame();
</script>
</body>
</html>
